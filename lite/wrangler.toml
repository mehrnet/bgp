name = "bgp-lite"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [
  { pattern = "bgp-lite.mehrnet.com", custom_domain = true }
]

rules = [
  { type = "Data", globs = ["**/*.mnl"], fallthrough = true }
]

[vars]
CORS_ALLOWED_ORIGINS_JSON = '["https://bgp.mehrnet.com"]'
