name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lint shell scripts
        run: shellcheck install.sh scripts/*.sh
      - name: Run Rust quality gate (line limits, fmt, clippy, unit tests)
        run: ./scripts/check-quality.sh
      - name: Typecheck and test bgp-lite worker
        run: |
          npm --prefix lite ci
          npm --prefix lite run typecheck
          npm --prefix lite test
      - name: Typecheck and test mini-js static bundles
        run: |
          npm --prefix mini-js ci
          npm --prefix mini-js run typecheck
          npm --prefix mini-js test
      - name: Check, test, and build web UI
        run: |
          npm --prefix web ci
          npm --prefix web run check
          npm --prefix web test
          npm --prefix web run build
      - name: Build static Linux x86_64 musl API binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --target x86_64-unknown-linux-musl -p bgp-api-server --bin bgp-api
          file target/x86_64-unknown-linux-musl/release/bgp-api
