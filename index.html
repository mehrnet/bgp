<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101516">
  <meta name="description" content="MehrNet BGP public IP and route intelligence lookup.">
  <title>BGP Lookup | MehrNet</title>
  <link rel="stylesheet" href="style.css?v=20260726-2309">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="MehrNet BGP home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">mehr<b>net</b> BGP</span>
        <span class="brand-sub">IP intelligence</span>
      </a>
      <div class="topbar-right">
        <a class="api-link" href="https://bgp-api.mehrnet.com/v1/health" target="_blank" rel="noopener">api / health</a>
        <span class="availability" id="availability" data-state="pending">checking</span>
      </div>
    </div>
  </header>

  <main>
    <section class="lookup" aria-labelledby="ip-heading">
      <p class="eyebrow">Public route intelligence</p>
      <div class="lookup-head">
        <h1 id="ip-heading">Resolving your address</h1>
        <p class="lookup-state" id="lookup-state" aria-live="polite">Querying the network record for this connection.</p>
      </div>
      <form class="command-strip" id="lookup-form" novalidate>
        <label class="input-wrap" for="ip-input">
          <span class="prompt" aria-hidden="true">&gt;</span>
          <span class="sr-only">IP address</span>
          <input id="ip-input" name="ip" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter IPv4 or IPv6 address" inputmode="text">
        </label>
        <button class="icon-button" type="submit" aria-label="Look up IP address" title="Look up IP address">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
        <button class="current-button" type="button" id="current-button">Use current IP</button>
      </form>
      <button class="ipv6-connection" id="connection-ipv6" type="button" data-state="checking" disabled hidden>
        <span><span class="connection-family">IPv6 connection</span><span class="connection-ip">Checking address</span></span>
        <span class="connection-status">checking</span>
      </button>
    </section>

    <section class="result skeleton" id="result" aria-label="IP lookup result" aria-busy="true">
      <div class="result-summary">
        <div class="summary-ip"><span class="label">Observed address</span><strong>&nbsp;</strong></div>
        <div class="summary-meta">
          <div class="summary-metric"><span class="label">Protocol</span><span class="metric-value">&nbsp;</span></div>
          <div class="summary-metric"><span class="label">Registry</span><span class="metric-value">&nbsp;</span></div>
          <div class="summary-metric"><span class="label">Country</span><span class="metric-value">&nbsp;</span></div>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="footer-inner"><span>MehrNet BGP Database</span><a href="https://bgp-api.mehrnet.com/v1/health" target="_blank" rel="noopener">Service status</a></div></footer>
  <script src="app.js?v=20260726-2309"></script>
</body>
</html>
