<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1417">
  <meta name="description" content="MehrNet BGP public IP and route intelligence lookup.">
  <title>MehrNet BGP</title>
  <link rel="stylesheet" href="style.css?v=20260726-2330">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="./" aria-label="MehrNet BGP home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-copy">
          <span class="brand-name">mehr<span>bgp</span></span>
          <span class="brand-byline">by mehrnet</span>
        </span>
      </a>

      <div class="nav-actions">
        <a class="api-link" href="https://bgp-api.mehrnet.com/v1/health" target="_blank" rel="noopener">
          API
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
        <span class="service-status" id="service-status" data-state="pending">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="service-status-text">Checking API</span>
        </span>
      </div>
    </div>
  </header>

  <main class="page">
    <header class="page-header">
      <div>
        <p class="kicker">Network intelligence</p>
        <h1>IP address lookup</h1>
      </div>
      <p class="request-status" id="request-status" aria-live="polite">Resolving your current connection</p>
    </header>

    <section class="lookup-tools" aria-label="IP lookup">
      <form class="lookup-form" id="lookup-form" novalidate>
        <label class="search-field" for="ip-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <span class="sr-only">IPv4 or IPv6 address</span>
          <input id="ip-input" name="ip" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="IPv4 or IPv6 address">
        </label>
        <button class="primary-button" type="submit">
          <span>Lookup</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="secondary-button" type="button" id="current-button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
          <span>My IP</span>
        </button>
      </form>

      <button class="ipv6-button" id="ipv6-button" type="button" hidden>
        <span class="ipv6-label">
          <span class="protocol-mark">IPv6</span>
          <span id="ipv6-address"></span>
        </span>
        <span class="ipv6-action">
          View IPv6
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </button>
    </section>

    <section id="result" class="result" aria-label="IP lookup result" aria-busy="true">
      <div class="loading-panel">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading network record</span>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>MehrNet BGP Database</span>
      <span>Global IPv4 &amp; IPv6 routing data</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js?v=20260726-2330"></script>
</body>
</html>
